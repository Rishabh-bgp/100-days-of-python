<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Colour Palette Generator</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto}.sw{display:flex;align-items:center;gap:1rem;margin:.3rem 0}
.chip{width:120px;height:40px;border-radius:6px;border:1px solid #ccc}.err{color:#b00}</style></head><body>
<h1>🎨 Image Colour Palette</h1>
<form method="post" enctype="multipart/form-data"><input type="file" name="image" accept="image/*" required>
<label>Colours <input type="number" name="n" value="10" min="1" max="20"></label><button>Extract</button></form>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
{% if colours %}<h2>Top colours</h2>{% for hex, share in colours %}
<div class="sw"><div class="chip" style="background:{{ hex }}"></div><code>{{ hex }}</code><span>{{ '%.1f' % (share * 100) }}%</span></div>{% endfor %}{% endif %}
</body></html>
