{% extends "base.html" %}{% block content %}{% for post in all_posts %}
<div class="mb-4"><a href="{{ url_for('show_post', post_id=post.id) }}" class="text-decoration-none"><h2>{{ post.title }}</h2><h5 class="text-muted">{{ post.subtitle }}</h5></a>
<p class="small">Posted by {{ post.author }} on {{ post.date }} · <a href="{{ url_for('delete_post', post_id=post.id) }}">✘ delete</a></p></div><hr>
{% endfor %}{% endblock %}
