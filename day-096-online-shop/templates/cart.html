{% extends "base.html" %}{% block content %}<h2>Your cart</h2>{% if not lines %}<p>Your cart is empty.</p>{% else %}
<table><tr><th>Item</th><th>Qty</th><th>Subtotal</th></tr>{% for l in lines %}<tr><td>{{ l.emoji }} {{ l.name }}</td>
<td><form method="post" action="{{ url_for('update_cart', pid=l.id) }}"><input type="number" name="qty" value="{{ l.qty }}" min="0" max="{{ l.stock }}" style="width:4rem"><button>Update</button></form></td>
<td>₹{{ l.subtotal }}</td></tr>{% endfor %}<tr><th colspan="2">Total</th><th>₹{{ total }}</th></tr></table>
<p><a href="{{ url_for('checkout') }}">Proceed to checkout →</a></p>{% endif %}{% endblock %}
