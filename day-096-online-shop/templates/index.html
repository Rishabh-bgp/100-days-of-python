{% extends "base.html" %}{% block content %}<p>{{ count }} item(s) in your cart</p><div class="grid">{% for p in products %}
<div class="card"><div class="emoji">{{ p.emoji }}</div><h3>{{ p.name }}</h3><p>₹{{ p.price }}</p><p><small>{{ p.stock }} in stock</small></p>
<form method="post" action="{{ url_for('add_to_cart', pid=p.id) }}"><button {{ 'disabled' if p.stock == 0 }}>Add to cart</button></form></div>{% endfor %}</div>{% endblock %}
