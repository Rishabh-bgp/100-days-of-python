<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Contact</title></head><body>
{% if msg_sent %}<h1>Successfully sent your message</h1>{% else %}<h1>Contact Me</h1>{% endif %}
<form action="{{ url_for('contact') }}" method="post">
<p><input name="name" placeholder="Name" required></p><p><input name="email" type="email" placeholder="Email" required></p>
<p><input name="phone" placeholder="Phone"></p><p><textarea name="message" placeholder="Message" required></textarea></p>
<button type="submit">Send</button></form></body></html>
